<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{report_title}</title>
<script src="https://cdn.tailwindcss.com"></script>
{maps_script}
<style>
  :root {{
    --app-bg-top: #fdf9ff;
    --app-bg-bottom: #f4f6ff;
    --app-ink: #0f172a;
    --app-muted: #64748b;
    --app-line: rgba(148, 163, 184, 0.18);
    --app-card-shadow: 0 20px 44px rgba(139,92,246,.08), 0 8px 22px rgba(15,23,42,.05);
    --app-card-shadow-strong: 0 28px 58px rgba(124,58,237,.12), 0 12px 28px rgba(15,23,42,.08);
    --app-icon-shadow: 0 12px 24px rgba(168,85,247,.14), inset 0 1px 0 rgba(255,255,255,.98), inset 0 -10px 16px rgba(15,23,42,.06);
    --lavender-50: #f7f2ff;
    --lavender-100: #efe5ff;
    --peach-50: #fff7ef;
    --mint-50: #eefcf5;
    --bottom-nav-space: 90px;
  }}
  body {{
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    margin:0;
    padding:0;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    color: var(--app-ink);
    background:
      radial-gradient(circle at top left, rgba(196,181,253,.32), transparent 30%),
      radial-gradient(circle at 88% 10%, rgba(253,230,138,.18), transparent 18%),
      radial-gradient(circle at 92% 28%, rgba(167,243,208,.16), transparent 20%),
      radial-gradient(circle at 10% 92%, rgba(191,219,254,.18), transparent 26%),
      linear-gradient(180deg, var(--app-bg-top) 0%, var(--app-bg-bottom) 100%);
    min-height:100vh;
    min-height:100dvh;
    position:relative;
    overflow-x:hidden;
  }}
  body::before {{
    content:"";
    position:fixed;
    inset:0;
    background:
      linear-gradient(135deg, rgba(255,255,255,.34), transparent 36%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.06) 0 1px, transparent 1px 18px);
    pointer-events:none;
    opacity:.72;
  }}
  * {{ box-sizing: border-box; }}
  .app-shell {{
    position:relative;
    isolation:isolate;
    overflow-x:hidden;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding-bottom:calc(var(--bottom-nav-space) + env(safe-area-inset-bottom, 0px)) !important;
  }}
  .app-shell::before {{
    content:"";
    position:absolute;
    inset:14px 12px auto;
    height:120px;
    border-radius:28px;
    background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(255,255,255,.42));
    box-shadow:0 20px 42px rgba(196,181,253,.18);
    filter:blur(8px);
    z-index:-1;
  }}
  .app-header {{
    margin:0 10px;
    border:1px solid rgba(255,255,255,.8);
    border-top:none;
    border-radius:0 0 24px 24px;
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(248,250,252,.82));
    backdrop-filter:blur(20px) saturate(1.3);
    box-shadow:0 16px 30px rgba(15,23,42,.09), inset 0 1px 0 rgba(255,255,255,.95);
  }}
  .status-pill {{
    box-shadow:0 8px 18px rgba(251,191,36,.18), inset 0 1px 0 rgba(255,255,255,.65);
  }}
  .condition-chip {{
    box-shadow:0 8px 18px rgba(15,23,42,.12), inset 0 1px 0 rgba(255,255,255,.35);
    transform:translateY(0);
    transition:transform .18s ease, box-shadow .18s ease;
  }}
  .context-chip {{
    display:inline-flex;
    align-items:center;
    padding:6px 10px;
    border-radius:999px;
    font-size:.74rem;
    font-weight:700;
    color:#334155;
    background:linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
    border:1px solid rgba(203,213,225,.95);
    box-shadow:0 6px 14px rgba(148,163,184,.12);
  }}
  .condition-chip:hover {{
    transform:translateY(-1px);
    box-shadow:0 12px 24px rgba(15,23,42,.16), inset 0 1px 0 rgba(255,255,255,.35);
  }}
  .ai-panel {{
    border:1px solid rgba(255,255,255,.9);
    background:linear-gradient(180deg, rgba(255,255,255,.94), rgba(248,250,252,.88));
    box-shadow:var(--app-card-shadow);
  }}
  .top-overview-panel {{
    border:1px solid rgba(255,255,255,.92);
    background:linear-gradient(180deg, rgba(239,246,255,.96), rgba(248,250,252,.92));
    box-shadow:var(--app-card-shadow);
  }}
  .ai-panel-kicker {{
    width:34px;
    height:34px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, #f8fbff 0%, #ddeafe 100%);
    box-shadow:var(--app-icon-shadow);
  }}
  .top-overview-kicker {{
    width:34px;
    height:34px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, #ffffff 0%, #dbeafe 100%);
    box-shadow:var(--app-icon-shadow);
  }}
  .hero-welcome-card {{
    display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(110px,.9fr);
    gap:14px;
    padding:18px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.92);
    background:
      radial-gradient(circle at top right, rgba(129,140,248,.18), transparent 30%),
      linear-gradient(135deg, rgba(255,255,255,.98) 0%, rgba(243,244,255,.96) 48%, rgba(237,233,254,.94) 100%);
    box-shadow:var(--app-card-shadow-strong);
    overflow:hidden;
    position:relative;
  }}
  .hero-welcome-card::before {{
    content:"";
    position:absolute;
    right:22px;
    top:20px;
    width:88px;
    height:88px;
    border-radius:28px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.94), rgba(237,233,254,.78)),
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), transparent 40%);
    border:1px solid rgba(255,255,255,.92);
    box-shadow:0 18px 34px rgba(124,58,237,.1);
    opacity:.85;
    pointer-events:none;
  }}
  .hero-welcome-card::after {{
    content:"";
    position:absolute;
    inset:auto -30px -35px auto;
    width:170px;
    height:170px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(167,139,250,.22) 0%, rgba(250,245,255,.08) 42%, transparent 72%);
    pointer-events:none;
  }}
  .hero-welcome-eyebrow {{ font-size:.82rem; font-weight:800; color:#7c3aed; margin-bottom:8px; }}
  .hero-welcome-title {{ font-size:1.58rem; line-height:1.2; font-weight:900; color:#111827; margin:0 0 10px; letter-spacing:-.02em; }}
  .hero-welcome-summary {{ font-size:.94rem; line-height:1.65; color:#334155; margin:0 0 12px; }}
  .hero-welcome-note {{
    font-size:.9rem;
    line-height:1.7;
    color:#312e81;
    background:rgba(255,255,255,.7);
    border:1px solid rgba(196,181,253,.55);
    border-radius:18px;
    padding:12px 14px;
    box-shadow:0 10px 20px rgba(124,58,237,.08);
  }}
  .hero-welcome-meta {{ margin-top:12px; font-size:.78rem; font-weight:700; color:#64748b; }}
  .hero-welcome-visual {{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:space-between;
    position:relative;
    min-height:172px;
  }}
  .hero-avatar-badge {{
    width:68px;
    height:68px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    font-weight:900;
    color:#334155;
    background:linear-gradient(180deg,#ffffff 0%, #e0f2fe 100%);
    box-shadow:var(--app-icon-shadow);
    border:1px solid rgba(255,255,255,.95);
  }}
  .hero-assistant-orb {{
    width:96px;
    height:96px;
    border-radius:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2.4rem;
    color:#6d28d9;
    background:
      radial-gradient(circle at 35% 28%, rgba(255,255,255,.98), rgba(255,255,255,.54) 34%, transparent 35%),
      linear-gradient(180deg, rgba(255,255,255,.96), rgba(233,213,255,.96));
    border:1px solid rgba(255,255,255,.95);
    box-shadow:0 22px 34px rgba(124,58,237,.16), inset 0 1px 0 rgba(255,255,255,.95);
  }}
  .quick-nav-strip {{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    padding:0 12px;
  }}
  .quick-nav-btn {{
    border:none;
    border-radius:18px;
    padding:12px 10px;
    text-align:center;
    background:linear-gradient(180deg, rgba(255,255,255,.96), rgba(239,246,255,.92));
    border:1px solid rgba(226,232,240,.95);
    box-shadow:0 12px 22px rgba(15,23,42,.06);
    cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }}
  .quick-nav-btn:hover {{ transform:translateY(-1px); box-shadow:0 16px 24px rgba(15,23,42,.09); }}
  .quick-nav-btn.active {{ border-color:rgba(139,92,246,.42); background:linear-gradient(180deg, rgba(243,244,255,.98), rgba(237,233,254,.92)); }}
  .quick-nav-icon {{ font-size:1.15rem; line-height:1; }}
  .quick-nav-title {{ margin-top:6px; font-size:.78rem; font-weight:850; color:#0f172a; }}
  .quick-nav-copy {{ margin-top:2px; font-size:.68rem; line-height:1.4; color:#64748b; }}
  .status-overview-card {{
    border-radius:28px;
    border:1px solid rgba(255,255,255,.94);
    background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,250,255,.96));
    box-shadow:var(--app-card-shadow);
    padding:18px;
  }}
  .status-overview-top {{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }}
  .status-overview-label {{ font-size:.92rem; color:#0f172a; font-weight:800; }}
  .status-overview-score {{ margin-top:6px; font-size:3rem; line-height:1; font-weight:900; color:#111827; letter-spacing:-.04em; }}
  .status-overview-score span {{ font-size:1rem; font-weight:700; color:#94a3b8; margin-left:4px; }}
  .status-overview-caption {{ margin-top:8px; font-size:.86rem; font-weight:800; }}
  .status-overview-ring {{
    position:relative;
    width:88px;
    height:88px;
    border-radius:999px;
    padding:8px;
    background:conic-gradient(from 180deg, rgba(124,58,237,.2), rgba(139,92,246,.92), rgba(59,130,246,.78));
    box-shadow:0 20px 32px rgba(99,102,241,.18);
  }}
  .status-overview-ring-fill {{ width:100%; height:100%; border-radius:999px; opacity:.92; }}
  .status-overview-ring-text {{
    position:absolute;
    inset:15px;
    border-radius:999px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.1rem;
    font-weight:900;
    color:#1f2937;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.96);
  }}
  .status-overview-progress {{ margin-top:14px; height:10px; border-radius:999px; background:#ede9fe; overflow:hidden; }}
  .status-overview-progress-bar {{ height:100%; border-radius:999px; background:linear-gradient(90deg, #8b5cf6 0%, #7c3aed 55%, #4f46e5 100%); }}
  .status-overview-foot {{ margin-top:12px; font-size:.84rem; line-height:1.65; color:#475569; }}
  .dashboard-panel {{
    border-radius:28px;
    border:1px solid rgba(255,255,255,.94);
    background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,250,255,.96));
    box-shadow:var(--app-card-shadow);
    padding:18px;
  }}
  .dashboard-panel-head {{ margin-bottom:12px; }}
  .dashboard-panel-title {{ font-size:1rem; font-weight:850; color:#0f172a; }}
  .dashboard-panel-copy {{ margin-top:4px; font-size:.8rem; color:#64748b; line-height:1.5; }}
  .dashboard-metric-grid {{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }}
  .dashboard-metric-card {{
    border-radius:20px;
    background:linear-gradient(180deg,#ffffff 0%, #f8fbff 100%);
    border:1px solid rgba(226,232,240,.95);
    box-shadow:0 12px 20px rgba(15,23,42,.05);
    padding:14px;
    min-height:132px;
  }}
  .dashboard-metric-icon {{ font-size:1.35rem; margin-bottom:8px; }}
  .dashboard-metric-title {{ font-size:.78rem; font-weight:800; color:#64748b; }}
  .dashboard-metric-value {{ margin-top:6px; font-size:1.28rem; font-weight:850; color:#0f172a; line-height:1.15; }}
  .dashboard-metric-note {{ margin-top:7px; font-size:.75rem; line-height:1.55; color:#64748b; }}
  .dashboard-progress-card {{
    margin-top:14px;
    border-radius:20px;
    background:linear-gradient(180deg, rgba(245,243,255,.96), rgba(255,255,255,.95));
    border:1px solid rgba(196,181,253,.55);
    padding:14px 15px;
  }}
  .dashboard-progress-title {{ font-size:.82rem; font-weight:850; color:#6d28d9; }}
  .dashboard-progress-copy {{ margin-top:6px; font-size:.84rem; line-height:1.65; color:#475569; }}
  .score-overview-card {{
    margin-bottom:14px;
    border-radius:24px;
    padding:16px;
    background:linear-gradient(135deg, rgba(124,58,237,.12), rgba(255,255,255,.98) 58%);
    border:1px solid rgba(196,181,253,.55);
    box-shadow:0 16px 30px rgba(99,102,241,.12);
  }}
  .score-overview-head {{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }}
  .score-overview-kicker {{ font-size:.78rem; font-weight:800; color:#7c3aed; }}
  .score-overview-value {{ margin-top:6px; font-size:2.3rem; line-height:1; font-weight:900; color:#111827; letter-spacing:-.04em; }}
  .score-overview-value span {{ margin-left:4px; font-size:.92rem; font-weight:700; color:#94a3b8; }}
  .score-overview-delta {{
    display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px;
    font-size:.74rem; font-weight:800;
  }}
  .score-overview-rail, .score-rail-wrap {{
    position:relative;
    margin-top:14px;
    height:10px;
    border-radius:999px;
    background:rgba(226,232,240,.9);
    overflow:visible;
  }}
  .score-overview-fill, .score-rail-fill {{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, #c4b5fd 0%, #8b5cf6 48%, #4f46e5 100%);
  }}
  .score-rail-marker {{
    position:absolute;
    top:50%;
    width:14px;
    height:14px;
    border-radius:999px;
    transform:translate(-50%, -50%);
    background:#fff;
    border:2px solid #cbd5e1;
    box-shadow:0 4px 10px rgba(15,23,42,.12);
  }}
  .score-rail-marker.current {{ border-color:#7c3aed; background:#7c3aed; }}
  .score-rail-marker.target {{ border-style:dashed; background:#fff7ed; border-color:#f59e0b; }}
  .score-rail-legend {{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:.7rem;
    font-weight:700;
    color:#64748b;
  }}
  .score-card-top {{ display:flex; align-items:flex-start; gap:10px; }}
  .score-card-main {{ flex:1; min-width:0; }}
  .score-card-icon {{
    width:38px; height:38px; margin-bottom:0; border-radius:14px; display:flex;
    align-items:center; justify-content:center; background:rgba(255,255,255,.92);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 10px 18px rgba(15,23,42,.06);
  }}
  .score-card-badge {{
    display:inline-flex; align-items:center; gap:5px; padding:6px 9px; border-radius:999px;
    border:1px solid rgba(148,163,184,.25); font-size:.68rem; font-weight:800; white-space:nowrap;
  }}
  .score-delta-chip {{
    display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:6px 10px;
    border-radius:999px; font-size:.71rem; font-weight:800;
  }}
  .trend-card {{
    border-radius:28px;
    border:1px solid rgba(255,255,255,.94);
    background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(247,250,255,.96));
    box-shadow:var(--app-card-shadow);
    padding:18px;
  }}
  .trend-card-head {{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }}
  .trend-card-head > div {{ min-width:0; }}
  .trend-card-title {{ font-size:1.04rem; font-weight:850; color:#0f172a; }}
  .trend-card-copy {{ margin-top:4px; font-size:.82rem; line-height:1.55; color:#64748b; }}
  .trend-range-tabs {{
    display:inline-grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:6px;
    padding:5px;
    border-radius:999px;
    background:#f1f5f9;
    border:1px solid rgba(226,232,240,.95);
  }}
  .trend-range-btn {{
    border:none;
    background:transparent;
    border-radius:999px;
    padding:8px 12px;
    font-size:.75rem;
    font-weight:800;
    color:#64748b;
    cursor:pointer;
    transition:all .18s ease;
  }}
  .trend-range-btn.active {{
    color:#6d28d9;
    background:linear-gradient(180deg, #ffffff 0%, #ede9fe 100%);
    box-shadow:0 8px 16px rgba(99,102,241,.12);
  }}
  .trend-insight-chip {{
    padding:8px 10px;
    border-radius:16px;
    background:linear-gradient(180deg, #ffffff 0%, #eff6ff 100%);
    border:1px solid rgba(191,219,254,.95);
    font-size:.74rem;
    font-weight:800;
    color:#2563eb;
    white-space:normal;
    line-height:1.45;
    max-width:100%;
  }}
  .trend-metric-stack {{ display:grid; grid-template-columns:1fr; gap:12px; }}
  .trend-metric-card {{
    border-radius:22px;
    padding:14px;
    background:linear-gradient(180deg,#ffffff 0%, #fbfdff 100%);
    border:1px solid rgba(226,232,240,.95);
    box-shadow:0 10px 18px rgba(15,23,42,.04);
  }}
  .trend-metric-top {{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }}
  .trend-metric-kicker {{ display:flex; align-items:center; gap:8px; }}
  .trend-metric-icon {{
    width:34px;
    height:34px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1rem;
    background:linear-gradient(180deg,#ffffff 0%, #eff6ff 100%);
    box-shadow:var(--app-icon-shadow);
  }}
  .trend-metric-label {{ font-size:.8rem; font-weight:800; color:#64748b; }}
  .trend-metric-value {{ margin-top:3px; font-size:1.2rem; font-weight:850; color:#0f172a; }}
  .trend-metric-delta {{ font-size:.75rem; font-weight:800; }}
  .trend-metric-copy {{ margin-top:8px; font-size:.76rem; line-height:1.55; color:#64748b; }}
  .trend-chart {{ width:100%; height:76px; margin-top:10px; display:block; }}
  .trend-axis {{ margin-top:6px; display:flex; justify-content:space-between; font-size:.68rem; color:#94a3b8; }}
  .priority-plan-card {{
    border-radius:28px;
    border:1px solid rgba(255,255,255,.94);
    background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(249,250,255,.96));
    box-shadow:var(--app-card-shadow);
    padding:18px;
  }}
  .priority-plan-head {{ margin-bottom:14px; }}
  .priority-plan-title {{ font-size:1.04rem; font-weight:850; color:#0f172a; }}
  .priority-plan-copy {{ margin-top:4px; font-size:.8rem; line-height:1.55; color:#64748b; }}
  .priority-task-card {{
    border-radius:22px;
    border:1px solid rgba(226,232,240,.95);
    background:linear-gradient(180deg,#ffffff 0%, #fbfcff 100%);
    box-shadow:0 12px 22px rgba(15,23,42,.05);
    padding:14px;
    margin-bottom:12px;
  }}
  .priority-task-main {{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:flex-start; }}
  .priority-task-index {{
    width:32px;
    height:32px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8b5cf6 0%, #7c3aed 100%);
    color:#fff;
    font-size:.9rem;
    font-weight:900;
    box-shadow:0 12px 20px rgba(124,58,237,.24);
  }}
  .priority-task-title {{ font-size:1rem; font-weight:800; line-height:1.45; color:#111827; }}
  .priority-task-reason {{ margin-top:8px; font-size:.8rem; line-height:1.6; color:#f97316; font-weight:700; }}
  .priority-task-emoji {{ font-size:2.1rem; line-height:1; filter:drop-shadow(0 10px 18px rgba(148,163,184,.16)); }}
  .priority-task-actions {{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:12px; }}
  .priority-task-btn {{
    border:none;
    border-radius:999px;
    padding:10px 12px;
    font-size:.78rem;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,#8b5cf6 0%, #7c3aed 100%);
    box-shadow:0 12px 20px rgba(124,58,237,.18);
    transition:background .18s ease, color .18s ease, box-shadow .18s ease, transform .18s ease, border-color .18s ease;
  }}
  .priority-task-btn:hover {{ transform:translateY(-1px); }}
  .priority-task-btn.active {{
    background:linear-gradient(135deg,#10b981 0%, #059669 100%);
    box-shadow:0 0 0 3px rgba(16,185,129,.14), 0 12px 20px rgba(5,150,105,.18);
  }}
  .priority-task-btn.secondary {{
    color:#6b7280;
    background:#f8fafc;
    border:1px solid #e2e8f0;
    box-shadow:none;
  }}
  .priority-task-btn.secondary.active {{
    color:#fff;
    background:#64748b;
    border-color:#64748b;
    box-shadow:0 0 0 3px rgba(100,116,139,.14);

<script>
const DAYS = ["周一","周二","周三","周四","周五","周六","周日"];
const MEAL_LABELS = {{"breakfast":"早餐","lunch":"午餐","dinner":"晚餐"}};
const rawMeals = {meal_data_json};
const mealSource = Array.isArray(rawMeals) ? rawMeals : [];
const meals = mealSource.map((item, i) => {{
  const source = item && typeof item === "object" ? item : {{}};
  return {{ ...source, day: source.day || DAYS[i] || `第${{i + 1}}天` }};
}});
const TREND_DATA = {trend_data_json};
let activeDay = 0;

function escapeHtml(value) {{
  const chars = {{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}};
  return String(value ?? "").replace(/[&<>"']/g, ch => chars[ch]);
}}

function encodeInlineValue(value) {{
  return encodeURIComponent(String(value ?? "")).replace(/'/g, "%27");
}}

function showMiniToast(message) {{
  let toast = document.getElementById('miniToast');
  if (!toast) {{
    toast = document.createElement('div');
    toast.id = 'miniToast';
    toast.className = 'mini-toast';
    document.body.appendChild(toast);
  }}
  toast.textContent = String(message || '已完成');
  toast.classList.add('show');
  clearTimeout(showMiniToast._timer);
  showMiniToast._timer = setTimeout(() => toast.classList.remove('show'), 1800);
}}

function fallbackCopyText(text) {{
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.appendChild(area);
  area.select();
  try {{ document.execCommand('copy'); }} catch (err) {{}}
  document.body.removeChild(area);
}}

function openExternalUrl(url) {{
  const win = window.open(url, '_blank', 'noopener,noreferrer');
  if (!win) window.location.href = url;
}}

function copyTextAndOpen(text, url, successMessage) {{
  const done = () => {{
    if (url) openExternalUrl(url);
    showMiniToast(successMessage || '已复制');
  }};
  if (navigator.clipboard && window.isSecureContext) {{
    navigator.clipboard.writeText(String(text || '')).then(done).catch(() => {{
      fallbackCopyText(String(text || ''));
      done();
    }});
    return;
  }}
  fallbackCopyText(String(text || ''));
  done();
}}

function openResourceSearch(query) {{
  const q = String(query || '').trim();
  if (!q) return;
  const encoded = encodeURIComponent(q);
  const fallbackUrl = `https://map.baidu.com/search/${{encoded}}`;
  if (!navigator.geolocation) {{
    openExternalUrl(fallbackUrl);
    return;
  }}
  navigator.geolocation.getCurrentPosition(
    (position) => {{
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const nearbyUrl = `https://api.map.baidu.com/place/search?query=${{encoded}}&location=${{lat}},${{lon}}&radius=5000&output=html&src=webapp.codex`;
      openExternalUrl(nearbyUrl);
    }},
    () => openExternalUrl(fallbackUrl),
    {{ enableHighAccuracy: false, timeout: 2500, maximumAge: 600000 }}
  );
}}

  simplified: "bg-rose-50 text-rose-700 border-rose-200",
  standard: "bg-amber-50 text-amber-700 border-amber-200",
  detailed: "bg-blue-50 text-blue-700 border-blue-200"
}};
let feedbackStore = JSON.parse(localStorage.getItem(FEEDBACK_STORAGE_KEY) || "{{}}");
const pendingFeedbackSubmits = {{}};
let stylePreferenceState = normalizeStylePreferenceState(JSON.parse(localStorage.getItem(STYLE_PREF_STORAGE_KEY) || "{{}}"));

function normalizeStyleMode(mode) {{
  const raw = String(mode || "").trim();
  return Object.prototype.hasOwnProperty.call(PROFILE_COPY_VARIANTS, raw) ? raw : "standard";
}}

function normalizeStylePreferenceState(raw) {{
  const source = raw && typeof raw === "object" ? raw : {{}};
  const previewed = Array.isArray(source.previewed_modes) ? source.previewed_modes : [];
  const normalizedPreviewed = [];
  previewed.forEach(function(item) {{
    const mode = normalizeStyleMode(item);
    if (!normalizedPreviewed.includes(mode)) normalizedPreviewed.push(mode);
  }});
  const selectedMode = source.explicitly_selected ? normalizeStyleMode(source.selected_mode || ASSIGNED_COMMUNICATION_MODE) : "";
  return {{
    assigned_mode: normalizeStyleMode(ASSIGNED_COMMUNICATION_MODE),
    selected_mode: selectedMode,
    explicitly_selected: Boolean(source.explicitly_selected && selectedMode),
    previewed_modes: normalizedPreviewed.slice(0, 6),
    updated_at: source.updated_at || null
  }};
}}

function persistStylePreferenceState() {{
  localStorage.setItem(STYLE_PREF_STORAGE_KEY, JSON.stringify(stylePreferenceState));
}}

function getStyleCopy(mode) {{
  return PROFILE_COPY_VARIANTS[normalizeStyleMode(mode)] || PROFILE_COPY_VARIANTS.standard || {{}};
}}

function getStyleMeta(mode) {{
  return COMMUNICATION_STYLE_META[normalizeStyleMode(mode)] || COMMUNICATION_STYLE_META.standard || {{}};
}}

function getEffectiveCommunicationMode() {{
  if (stylePreferenceState.explicitly_selected && stylePreferenceState.selected_mode) {{
    return normalizeStyleMode(stylePreferenceState.selected_mode);
  }}
  return normalizeStyleMode(ASSIGNED_COMMUNICATION_MODE);
}}

function getStylePreferenceCount() {{
  return stylePreferenceState.explicitly_selected ? 1 : 0;
}}

function syncHomeOnlyPanels(pageKey) {{
  const activeKey = String(pageKey || document.querySelector(".journey-page.active")?.dataset.page || "home");
  const showHomePanels = activeKey === "home";
  const styleShell = document.getElementById("stylePreferenceShell");
  const submitShell = document.getElementById("submitCtaShell");
  if (styleShell) styleShell.style.display = showHomePanels ? "block" : "none";
  if (submitShell) submitShell.style.display = showHomePanels ? "block" : "none";
  return showHomePanels;
}}

function buildCommunicationStylePreference() {{
  const assignedMode = normalizeStyleMode(ASSIGNED_COMMUNICATION_MODE);
  const previewMode = getEffectiveCommunicationMode();
  const assignedMeta = getStyleMeta(assignedMode);
  const previewMeta = getStyleMeta(previewMode);
  return {{
    assigned_mode: assignedMode,
    assigned_label: assignedMeta.label || "",
    preview_mode: previewMode,
    preview_label: previewMeta.label || "",
    preferred_mode: stylePreferenceState.explicitly_selected ? previewMode : null,
    preferred_label: stylePreferenceState.explicitly_selected ? (previewMeta.label || "") : null,
    explicitly_selected: Boolean(stylePreferenceState.explicitly_selected),
    is_override: Boolean(stylePreferenceState.explicitly_selected && previewMode !== assignedMode),
    previewed_modes: stylePreferenceState.previewed_modes || [],
    updated_at: stylePreferenceState.updated_at || null
  }};
}}

function applyCommunicationStyle(mode) {{
  const nextMode = normalizeStyleMode(mode);
  const copy = getStyleCopy(nextMode);
  const meta = getStyleMeta(nextMode);
  document.documentElement.dataset.communicationMode = nextMode;
  Object.entries(copy).forEach(function(entry) {{
    const key = entry[0];
    const value = entry[1];
    document.querySelectorAll(`[data-copy-key="${{key}}"]`).forEach(function(node) {{
      node.textContent = String(value || "");
    }});
  }});
  document.querySelectorAll('[data-style-meta="label"]').forEach(function(node) {{
    node.textContent = String(meta.label || "");
  }});
  document.querySelectorAll('[data-style-meta="chip"]').forEach(function(node) {{
    node.textContent = String(meta.chip || "");
    node.className = "inline-flex items-center rounded-full border px-2 py-1 text-[11px] font-semibold " + (STYLE_MODE_CHIP_CLASS_MAP[nextMode] || STYLE_MODE_CHIP_CLASS_MAP.standard);
  }});
}}

function renderStylePreferencePanel(mode) {{
  const activeMode = normalizeStyleMode(mode || getEffectiveCommunicationMode());
  const assignedMode = normalizeStyleMode(ASSIGNED_COMMUNICATION_MODE);
  const assignedMeta = getStyleMeta(assignedMode);
  const previewMeta = getStyleMeta(activeMode);
  const previewCopy = getStyleCopy(activeMode);
  const assignedBadge = document.getElementById("assignedStyleBadge");
  const list = document.getElementById("styleOptionList");
  const previewBadge = document.getElementById("stylePreviewBadge");
  const previewStatus = document.getElementById("stylePreviewStatus");
  const previewHero = document.getElementById("stylePreviewHero");
  const previewWhy = document.getElementById("stylePreviewWhy");
  const previewNote = document.getElementById("stylePreviewNote");
  if (assignedBadge) assignedBadge.textContent = "系统当前分配：" + (assignedMeta.label || "");
  if (list) {{
    list.innerHTML = Object.entries(COMMUNICATION_STYLE_META).map(function(entry) {{
      const optionMode = normalizeStyleMode(entry[0]);
      const meta = entry[1] || {{}};
      const activeClass = optionMode === activeMode ? " active" : "";
      const badges = [];
      if (optionMode === assignedMode) badges.push('<span class="style-option-badge">系统当前</span>');
      if (stylePreferenceState.explicitly_selected && optionMode === normalizeStyleMode(stylePreferenceState.selected_mode)) {{
        badges.push('<span class="style-option-badge primary">您的偏好</span>');
      }}
      return `
        <button type="button" class="style-option${{activeClass}}" onclick="setCommunicationStyle('${{optionMode}}')">
          <div class="style-option-top">
            <div>
              <div class="style-option-label">${{escapeHtml(meta.label || optionMode)}}</div>
              <div class="style-option-chip">${{escapeHtml(meta.chip || "")}}</div>
            </div>
            <div class="style-option-state">${{badges.join('')}}</div>
          </div>
          <div class="style-option-desc">${{escapeHtml(meta.description || "")}}</div>
        </button>`;
    }}).join("");
  }}
  if (previewBadge) previewBadge.textContent = (previewMeta.label || "") + " · " + (previewMeta.chip || "");
  if (previewStatus) {{
    if (stylePreferenceState.explicitly_selected) {{
      previewStatus.textContent = activeMode === assignedMode ? "您已确认沿用系统推荐" : "您已改成这个风格，提交后下次优先参考";
    }} else {{
      previewStatus.textContent = "当前按系统分配风格展示";
    }}
  }}
  if (previewHero) previewHero.textContent = String(previewCopy.hero_tagline || "");
  if (previewWhy) previewWhy.textContent = "说明页会更偏向：" + String(previewCopy.why_subtitle || "");
  if (previewNote) previewNote.textContent = String(previewMeta.preview_note || "");
}}

function setCommunicationStyle(mode) {{
  const nextMode = normalizeStyleMode(mode);
  const history = [nextMode].concat((stylePreferenceState.previewed_modes || []).filter(function(item) {{
    return normalizeStyleMode(item) !== nextMode;
  }})).slice(0, 6);
  stylePreferenceState = {{
    assigned_mode: normalizeStyleMode(ASSIGNED_COMMUNICATION_MODE),
    selected_mode: nextMode,
    explicitly_selected: true,
    previewed_modes: history,
    updated_at: new Date().toISOString()
  }};
  persistStylePreferenceState();
  applyCommunicationStyle(nextMode);
  renderStylePreferencePanel(nextMode);
  updateExportBadge();
}}

function saveFeedback(dayIdx, mealType, itemName, reason) {{
  const key = `${{dayIdx}}-${{mealType}}-${{itemName}}`;
  feedbackStore[key] = {{ sentiment: "dislike", reason, timestamp: new Date().toISOString() }};
  localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(feedbackStore));
  updateExportBadge();
}}

function clearFeedbackEntry(dayIdx, mealType, itemName) {{
  const key = `${{dayIdx}}-${{mealType}}-${{itemName}}`;
  delete feedbackStore[key];
  localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(feedbackStore));
}}

function applyStaticButtonState(sourceEl, sentiment) {{
  if (!sourceEl) return;
  const group = sourceEl.closest(".priority-task-actions, .feedback-actions, .journey-task");
  if (!group) return;
  group.querySelectorAll("button").forEach(function(btn) {{
    const isSecondary = btn.classList.contains("secondary") || btn.classList.contains("feedback-skip");
    btn.classList.remove("liked", "disliked", "active");
    if (btn.dataset.defaultLabel) btn.textContent = btn.dataset.defaultLabel;
    if (sentiment === "like" && !isSecondary) {{
      if (btn.classList.contains("priority-task-btn")) btn.classList.add("active");
      else btn.classList.add("liked");
      if (btn.dataset.activeLabel) btn.textContent = btn.dataset.activeLabel;
    }}
    if (sentiment === "dislike" && isSecondary) {{
      if (btn.classList.contains("priority-task-btn")) btn.classList.add("active");
      else btn.classList.add("disliked");
      if (btn.dataset.activeLabel) btn.textContent = btn.dataset.activeLabel;
    }}
  }});
}}

function clearStaticButtonState(sourceEl) {{
  applyStaticButtonState(sourceEl, null);
}}

function syncStaticButtonState(dayIdx, mealType, itemName) {{
  const feedback = getFeedback(dayIdx, mealType, itemName);
  if (!feedback) return;
  const selector = [
    `[data-day-idx="${{dayIdx}}"]`,
    `[data-meal-type="${{mealType}}"]`,
    `[data-item-name="${{itemName.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}}"]`
  ].join("");
  const button = document.querySelector(selector);
  if (button) applyStaticButtonState(button, feedback.sentiment);
}}

function hydrateStaticFeedbackStates() {{
  document.querySelectorAll("[data-day-idx][data-meal-type][data-item-name]").forEach(function(btn) {{
    const dayIdx = Number(btn.dataset.dayIdx);
    const mealType = btn.dataset.mealType;
    if (dayIdx < 0 && mealType === "priority") return;
    const itemName = btn.dataset.itemName;
    const feedback = getFeedback(dayIdx, mealType, itemName);
    if (feedback) applyStaticButtonState(btn, feedback.sentiment);
  }});
}}

function saveLike(dayIdx, mealType, itemName, sourceEl) {{
  const key = `${{dayIdx}}-${{mealType}}-${{itemName}}`;
  const existing = feedbackStore[key];
  const isActive = sourceEl && (sourceEl.classList.contains("liked") || sourceEl.classList.contains("active"));
  if (existing && existing.sentiment === "like" && isActive) {{
    clearFeedbackEntry(dayIdx, mealType, itemName);
    if (dayIdx < 0) clearStaticButtonState(sourceEl);
    renderMeals();
    updateExportBadge();
    return;
  }}
  feedbackStore[key] = {{ sentiment: "like", reason: null, timestamp: new Date().toISOString() }};
  localStorage.setItem(FEEDBACK_STORAGE_KEY, JSON.stringify(feedbackStore));
  if (dayIdx < 0) applyStaticButtonState(sourceEl, "like");
  renderMeals();
  updateExportBadge();
}}

function getFeedback(dayIdx, mealType, itemName) {{
  return feedbackStore[`${{dayIdx}}-${{mealType}}-${{itemName}}`];
}}

function saveLikeFromButton(button) {{
  saveLike(Number(button.dataset.dayIdx), button.dataset.mealType, button.dataset.itemName, button);
}}

function showFeedbackModalFromButton(button) {{
  showFeedbackModal(Number(button.dataset.dayIdx), button.dataset.mealType, button.dataset.itemName, button);
}}

function buildPreferencePayload() {{
  const likes = [];
  const dislikes = [];
  for (const [key, val] of Object.entries(feedbackStore)) {{
    const entry = {{ item_key: key, ...val }};
    if (val.sentiment === "like") likes.push(entry);
    else dislikes.push(entry);
  }}
  const selectedCuisines = Object.entries(cuisinePrefs).map(([name, meta]) => ({{
    cuisine: name, ...meta
  }}));
  const stylePreference = buildCommunicationStylePreference();
  const totalFeedback = likes.length + dislikes.length;
  const totalPreferences = totalFeedback + selectedCuisines.length + getStylePreferenceCount();
  return {{
    user_id: {patient_id_json},
    data_type: "scenario",
    language: "zh",
    timestamp: new Date().toISOString(),
    data: {{
      bundle: {{
        type: "user_preference",
        report_time: {current_time_json},
        total_feedback: totalFeedback,
        total_preferences: totalPreferences,
        cuisine_preferences: selectedCuisines,
        communication_style_preference: stylePreference,
        liked: likes,
        disliked: dislikes
      }}
    }}
  }};
}}

function exportFeedbackJSON() {{
  const payload = buildPreferencePayload();
  const btn = document.getElementById("exportFeedbackBtn");
  if (!btn) return;
  const origText = btn.textContent;
  const feedbackId = "feedback_" + Date.now() + "_" + Math.random().toString(36).slice(2);
  pendingFeedbackSubmits[feedbackId] = {{ btn, origText }};
  btn.textContent = "⏳ 提交中...";
  btn.disabled = true;
  window.parent.postMessage({{
    type: "skill_feedback",
    feedback_id: feedbackId,
    payload
  }}, "*");
  setTimeout(() => {{
    if (!pendingFeedbackSubmits[feedbackId]) return;
    delete pendingFeedbackSubmits[feedbackId];
    btn.textContent = origText;
    btn.disabled = false;
  }}, 8000);
}}

window.addEventListener("message", function(event) {{
  const data = event.data || {{}};
  if (data.type !== "skill_feedback_result" || !data.feedback_id) return;
  const pending = pendingFeedbackSubmits[data.feedback_id];
  if (!pending) return;
  delete pendingFeedbackSubmits[data.feedback_id];
  pending.btn.textContent = data.ok === false ? "提交失败" : "✓ 已提交";
  setTimeout(() => {{
    pending.btn.textContent = pending.origText;
    pending.btn.disabled = false;
  }}, 2500);
}});

function updateExportBadge() {{
  const shell = document.getElementById("submitCtaShell");
  const btn = document.getElementById("exportFeedbackBtn");
  const hint = document.getElementById("submitHint");
  if (!btn) return;
  const showHomePanels = syncHomeOnlyPanels();
  const fbCount = Object.keys(feedbackStore).length;
  const cuisineCount = Object.keys(cuisinePrefs).length;
  const styleCount = getStylePreferenceCount();
  const total = fbCount + cuisineCount + styleCount;
  if (shell) shell.style.display = showHomePanels ? "block" : "none";
  if (total > 0) {{
    btn.textContent = "✓ 提交我的偏好 (" + total + ")";
    btn.disabled = false;
    btn.style.display = "inline-block";
    if (hint) {{
      hint.style.display = "block";
      hint.textContent = "您的选择会用于下次生成更合适的建议，并可写入 memory";
    }}
  }} else {{
    btn.disabled = true;
    btn.textContent = "✓ 先选择偏好再提交";
    btn.style.display = "inline-block";
    if (hint) {{
      hint.style.display = "block";
      hint.textContent = "请先选择口味、标记适合/不适合，或确认喜欢的话术风格";
    }}
  }}
}}

function showFeedbackModal(dayIdx, mealType, itemName, sourceEl) {{
  const existing = document.querySelector('.feedback-modal');
  if (existing) existing.remove();
  const isMeal = dayIdx >= 0;
  const reasons = isMeal ? MEAL_FEEDBACK_REASONS : GENERAL_FEEDBACK_REASONS;
  const title = isMeal ? "为什么不想要这个食物？" : "为什么这个建议不适合您？";
  const displayName = itemName.length > 60 ? itemName.substring(0, 57) + "..." : itemName;
  const modal = document.createElement('div');
  modal.className = 'feedback-modal';
  modal.innerHTML = `
    <div class="feedback-modal-box">
      <div class="text-sm font-bold text-slate-800 mb-1">${{title}}</div>
      <div class="text-xs text-slate-500 mb-3">${{escapeHtml(displayName)}}</div>
      ${{reasons.map(r => `<button class="feedback-reason" data-reason="${{escapeHtml(r)}}">${{escapeHtml(r)}}</button>`).join('')}}
      <button class="feedback-reason" style="color:#94a3b8;border-color:#e2e8f0;margin-top:8px" data-reason="__cancel__">取消</button>
    </div>`;
  modal.addEventListener('click', function(e) {{
    const reason = e.target.dataset.reason;
    if (!reason) return;
    if (reason === '__cancel__') {{ modal.remove(); return; }}
    saveFeedback(dayIdx, mealType, itemName, reason);
    if (!isMeal) applyStaticButtonState(sourceEl, "dislike");
    modal.remove();
    if (isMeal) renderMeals();
    e.target.closest('.feedback-modal').remove();
  }});
  document.body.appendChild(modal);
}}

function renderTabs() {{
  const container = document.getElementById("dayTabs");
  if (!container) return;
  container.innerHTML = meals.map((day, i) => {{
    const label = day.day || DAYS[i] || `第${{i + 1}}天`;
    return `<button onclick="switchDay(${{i}})" class="meal-day-tab ${{i === activeDay ? 'active' : ''}}">${{escapeHtml(label)}}</button>`;
  }}).join("");
}}

function switchDay(i) {{
  activeDay = i;
  renderTabs();
  renderMeals();
}}

function renderMeals() {{
  const container = document.getElementById("mealContent");
  if (!container) return;
  const day = meals[activeDay];
  if (!day) {{ container.innerHTML = '<p class="text-sm text-slate-400">暂无数据</p>'; return; }}
  let html = "";
  for (const [key, label] of Object.entries(MEAL_LABELS)) {{
    const items = day[key] || [];
    if (!items.length) continue;
    html += `<div class="mb-4"><div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">${{label}}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
    for (const it of items) {{
      const fb = getFeedback(activeDay, key, it.name);
      const likeClass = fb && fb.sentiment === "like" ? "liked" : "";
      const dislikeClass = fb && fb.sentiment === "dislike" ? "disliked" : "";
      const itemName = String(it.name || "");
      const safeName = encodeInlineValue(itemName);
      const reason = it.adc_reason || (
        it.condition && it.benefit
          ? "适合" + it.condition + "：" + it.benefit
          : (it.benefit || "")
      );
      html += `<div class="meal-card flex items-start gap-3 bg-slate-50 rounded-lg p-3 border border-slate-100">
        <span class="text-2xl mt-0.5">${{escapeHtml(it.icon || "🍽️")}}</span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-800">${{escapeHtml(itemName)}}</div>
          <div class="text-xs meal-reason mt-0.5 leading-relaxed">${{escapeHtml(reason)}}</div>
        </div>
        <div class="feedback-actions">
          <button class="feedback-btn like ${{likeClass}}" title="保留这条膳食建议" onclick="saveLike(${{activeDay}},'${{key}}',decodeURIComponent('${{safeName}}'), this)">适合我</button>
          <button class="feedback-btn feedback-skip ${{dislikeClass}}" title="这个不适合我" onclick="showFeedbackModal(${{activeDay}},'${{key}}',decodeURIComponent('${{safeName}}'), this)">不适合</button>
        </div>
      </div>`;
    }}
    html += "</div></div>";
  }}
  container.innerHTML = html;
}}

function buildTrendSparkline(values, color) {{
  if (!Array.isArray(values) || !values.length) return "";
  const width = 320;
  const height = 76;
  const pad = 6;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = Math.max(max - min, 1);
  const points = values.map((val, idx) => {{
    const x = pad + (idx * (width - pad * 2)) / Math.max(values.length - 1, 1);
    const y = height - pad - ((val - min) / span) * (height - pad * 2);
    return [x, y];
  }});
  function smoothPath(items) {{
    if (items.length === 1) return `M ${{items[0][0].toFixed(1)}} ${{items[0][1].toFixed(1)}}`;
    let d = `M ${{items[0][0].toFixed(1)}} ${{items[0][1].toFixed(1)}}`;
    for (let i = 0; i < items.length - 1; i++) {{
      const [x0, y0] = items[i];
      const [x1, y1] = items[i + 1];
      const dx = (x1 - x0) * 0.45;
      d += ` C ${{(x0 + dx).toFixed(1)}} ${{y0.toFixed(1)}}, ${{(x1 - dx).toFixed(1)}} ${{y1.toFixed(1)}}, ${{x1.toFixed(1)}} ${{y1.toFixed(1)}}`;
    }}
    return d;
  }}
  const line = smoothPath(points);
  const area = `${{line}} L ${{width}} ${{height}} L 0 ${{height}} Z`;
  const last = points[points.length - 1];
  const dots = points.map(([x, y], idx) => {{
    const isActive = idx === points.length - 1;
    return `<circle class="trend-point-dot ${{isActive ? 'active' : ''}}" data-point-index="${{idx}}" onclick="setTrendPointFromDot(this)" cx="${{x.toFixed(1)}}" cy="${{y.toFixed(1)}}" r="${{isActive ? '3.3' : '2.4'}}" fill="#fff" stroke="${{color}}" stroke-width="1.7" opacity="${{isActive ? '1' : '.62'}}"></circle>`;
  }}).join("");
  const gradId = "trendFill" + Math.abs(color.split("").reduce((sum, ch) => sum + ch.charCodeAt(0), 0));
  return `
    <svg class="trend-chart" viewBox="0 0 ${{width}} ${{height}}" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="${{gradId}}" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="${{color}}" stop-opacity="0.22"></stop>
          <stop offset="100%" stop-color="${{color}}" stop-opacity="0"></stop>
        </linearGradient>
      </defs>
      <path class="trend-area" d="${{area}}" fill="url(#${{gradId}})" stroke="none"></path>
      <path d="${{line}}" fill="none" stroke="${{color}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
      ${{dots}}
      <circle class="trend-selected-dot" cx="${{last[0].toFixed(1)}}" cy="${{last[1].toFixed(1)}}" r="5.2" fill="#fff" stroke="${{color}}" stroke-width="2.3"></circle>
    </svg>`;
}}

function updateTrendPoint(sourceEl, forcedIndex) {{
  const card = sourceEl.closest(".trend-metric-card");
  if (!card) return;
  const rangeKey = card.dataset.rangeKey;
  const metricIndex = Number(card.dataset.metricIndex || 0);
  const pointIndex = Number(forcedIndex ?? sourceEl.dataset.pointIndex ?? 0);
  const metric = (TREND_DATA[rangeKey] && TREND_DATA[rangeKey].metrics || [])[metricIndex] || {{}};
  const point = (metric.points || [])[pointIndex];
  const readout = card.querySelector(".trend-point-readout");
  if (readout && point) readout.textContent = `${{point.label || ""}} · ${{point.display || point.value || ""}}`;

  card.querySelectorAll(".trend-point-dot").forEach(function(dot) {{
    const active = Number(dot.dataset.pointIndex || 0) === pointIndex;
    dot.classList.toggle("active", active);
    dot.setAttribute("r", active ? "3.3" : "2.4");
    dot.setAttribute("opacity", active ? "1" : ".62");
  }});
  const selected = card.querySelector(".trend-selected-dot");
  const dot = card.querySelector(`.trend-point-dot[data-point-index="${{pointIndex}}"]`);
  if (selected && dot) {{
    selected.setAttribute("cx", dot.getAttribute("cx"));
    selected.setAttribute("cy", dot.getAttribute("cy"));
  }}
}}

function setTrendPointFromDot(dot) {{
  updateTrendPoint(dot, Number(dot.dataset.pointIndex || 0));
}}

function renderTrendRange(rangeKey) {{
  const data = TREND_DATA[String(rangeKey)];
  if (!data) return;
  document.querySelectorAll(".trend-range-btn").forEach(function(btn) {{
    btn.classList.toggle("active", btn.dataset.range === String(rangeKey));
  }});
  const shell = document.getElementById("trendMetricStack");
  const chip = document.getElementById("trendInsightChip");
  if (chip && data.insight) chip.textContent = data.insight;
  if (!shell) return;
  shell.innerHTML = (data.metrics || []).map(function(metric, metricIndex) {{
    const deltaColor = metric.delta_direction === "down" ? "#f97316" : (metric.delta_direction === "up" ? "#10b981" : "#64748b");
    const points = metric.points || [];
    const lastPointIndex = Math.max(points.length - 1, 0);
    const lastPoint = points[lastPointIndex] || null;
    const readout = points.length ? `<div class="trend-point-readout">${{lastPoint ? `${{lastPoint.label || ""}} · ${{lastPoint.display || lastPoint.value || ""}}` : ""}}</div>` : "";
    return `
      <div class="trend-metric-card" data-range-key="${{String(rangeKey)}}" data-metric-index="${{metricIndex}}">
        <div class="trend-metric-top">
          <div class="trend-metric-kicker">
            <div class="trend-metric-icon">${{metric.icon}}</div>
            <div>
              <div class="trend-metric-label">${{metric.label}}</div>
              <div class="trend-metric-value">${{metric.value}}</div>
            </div>
          </div>
          <div class="trend-metric-delta" style="color:${{deltaColor}}">${{metric.delta}}</div>
        </div>
        <div class="trend-metric-copy">${{metric.copy}}</div>
        ${{readout}}
        ${{buildTrendSparkline(metric.values || [], metric.color || "#8b5cf6")}}
        <div class="trend-axis"><span>${{data.axis_start || ""}}</span><span>${{data.axis_end || ""}}</span></div>
      </div>`;
  }}).join("");
  shell.querySelectorAll(".trend-point-dot.active").forEach(function(dot) {{
    updateTrendPoint(dot, Number(dot.dataset.pointIndex || 0));
  }});
}}

const DEFAULT_CUISINES = [
  {{ name: "家常菜", icon: "🍚" }},
  {{ name: "粤菜", icon: "🥡" }},
  {{ name: "川菜", icon: "🌶️" }},
  {{ name: "江浙菜", icon: "🥢" }},
  {{ name: "清淡饮食", icon: "🥣" }},
  {{ name: "地中海饮食", icon: "🫒" }},
  {{ name: "日式", icon: "🍣" }},
  {{ name: "意式", icon: "🍝" }},
];

let cuisinePrefs = JSON.parse(localStorage.getItem(CUISINE_STORAGE_KEY) || "{{}}");

function renderCuisineChips() {{
  const container = document.getElementById("cuisineChips");
  if (!container) return;
  const allCuisines = [...DEFAULT_CUISINES];
  const customNames = Object.keys(cuisinePrefs).filter(n => !DEFAULT_CUISINES.some(d => d.name === n));
  for (const cn of customNames) {{
    allCuisines.push({{ name: cn, icon: "🍽️" }});
  }}
  container.innerHTML = allCuisines.map(c => {{
    const sel = cuisinePrefs[c.name] ? "selected" : "";
    const safeName = encodeInlineValue(c.name);
    return `<span class="cuisine-chip ${{sel}}" onclick="toggleCuisine(decodeURIComponent('${{safeName}}'))">${{escapeHtml(c.icon)}} ${{escapeHtml(c.name)}}<span class="chip-x" onclick="event.stopPropagation();removeCuisine(decodeURIComponent('${{safeName}}'))">✕</span></span>`;
  }}).join("");
  updateExportBadge();
}}

function toggleCuisine(name) {{
  if (cuisinePrefs[name]) {{
    delete cuisinePrefs[name];
  }} else {{
    cuisinePrefs[name] = {{ selected_at: new Date().toISOString() }};
  }}
  localStorage.setItem(CUISINE_STORAGE_KEY, JSON.stringify(cuisinePrefs));
  renderCuisineChips();
  showCuisineToast();
}}

function showCuisineToast() {{
  const selected = Object.keys(cuisinePrefs);
  if (!selected.length) return;
  let existing = document.getElementById("cuisineToast");
  if (!existing) {{
    existing = document.createElement("div");
    existing.id = "cuisineToast";
    existing.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 20px;border-radius:12px;font-size:0.8em;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:9999;transition:opacity 0.3s;max-width:90%;text-align:center";
    document.body.appendChild(existing);
  }}
  existing.textContent = "✓ 已保存！下次报告会参考：" + selected.join("、");
  existing.style.opacity = "1";
  clearTimeout(existing._timer);
  existing._timer = setTimeout(() => {{ existing.style.opacity = "0"; }}, 3000);
}}

function removeCuisine(name) {{
  delete cuisinePrefs[name];
  localStorage.setItem(CUISINE_STORAGE_KEY, JSON.stringify(cuisinePrefs));
  renderCuisineChips();
}}

function addCustomCuisine() {{
  const input = document.getElementById("customCuisineInput");
  const name = (input.value || "").trim();
  if (!name) return;
  cuisinePrefs[name] = {{ selected_at: new Date().toISOString(), custom: true }};
  localStorage.setItem(CUISINE_STORAGE_KEY, JSON.stringify(cuisinePrefs));
  input.value = "";
  renderCuisineChips();
}}

const customCuisineInput = document.getElementById("customCuisineInput");
if (customCuisineInput) {{
  customCuisineInput.addEventListener("keydown", function(e) {{
    if (e.key === "Enter") {{ e.preventDefault(); addCustomCuisine(); }}
  }});
}}

renderCuisineChips();
renderTabs();
renderMeals();
applyCommunicationStyle(getEffectiveCommunicationMode());
renderStylePreferencePanel(getEffectiveCommunicationMode());
updateExportBadge();
hydrateStaticFeedbackStates();
const defaultTrendRange = Object.keys(TREND_DATA || {{}})[0];
if (defaultTrendRange) renderTrendRange(defaultTrendRange);
switchJourneyPage("home", true);

// ─── Card Accordion Toggle ───
document.querySelectorAll(".section-card-header").forEach(function(header) {{
  header.addEventListener("click", function() {{
    const card = header.closest(".section-card");
    if (!card) return;
    const wasExpanded = card.classList.contains("expanded");
    card.classList.toggle("expanded");
    if (!wasExpanded) {{
      setTimeout(function() {{ card.scrollIntoView({{ behavior: "smooth", block: "start" }}); }}, 100);
    }}
  }});
}});

// ─── Sub-card Toggle (tap item to expand its details) ───
document.querySelectorAll(".sub-card-header").forEach(function(header) {{
  if (header.closest(".sub-card-static")) return;
  header.addEventListener("click", function(e) {{
    e.stopPropagation();
    header.closest(".sub-card").classList.toggle("open");
  }});
}});
</script>
</body>
