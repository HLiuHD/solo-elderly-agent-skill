<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{report_title}</title>
<script src="https://cdn.tailwindcss.com"></script>
{maps_script}
<style>
  body {{ font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; margin:0; padding:0; -webkit-text-size-adjust:100%; }}
  * {{ box-sizing: border-box; }}
  .meal-card {{ transition: all .2s; }}
  .meal-card:hover {{ transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.08); }}
  .feedback-btn {{ opacity:0; transition: opacity .2s; cursor:pointer; border:none; background:transparent; font-size:0.9em; padding:2px 4px; border-radius:4px; }}
  .meal-card:hover .feedback-btn {{ opacity:1; }}
  .feedback-btn:hover {{ background:#fee2e2; }}
  .feedback-btn.like:hover {{ background:#dcfce7; }}
  .feedback-btn.liked {{ opacity:1; background:#dcfce7; }}
  .feedback-btn.disliked {{ opacity:1; background:#fef3c7; }}
  .feedback-modal {{ position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; z-index:9999; }}
  .feedback-modal-box {{ background:#fff; border-radius:16px; padding:24px; max-width:320px; width:90%; box-shadow:0 20px 60px rgba(0,0,0,.2); }}
  .feedback-reason {{ display:block; width:100%; text-align:left; padding:10px 14px; margin:6px 0; border:1px solid #e2e8f0; border-radius:10px; background:#f8fafc; font-size:0.85em; cursor:pointer; transition:all .15s; }}
  .feedback-reason:hover {{ background:#eff6ff; border-color:#93c5fd; }}
  .cuisine-chip {{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px; font-size:0.8em; font-weight:500; cursor:pointer; border:2px solid #e2e8f0; background:#f8fafc; color:#475569; transition:all 0.2s; user-select:none; }}
  .cuisine-chip:hover {{ border-color:#a7f3d0; background:#ecfdf5; }}
  .cuisine-chip.selected {{ border-color:#10b981; background:#d1fae5; color:#065f46; }}
  .cuisine-chip .chip-x {{ font-size:0.75em; opacity:0; padding:2px; border-radius:50%; }}
  .cuisine-chip.selected .chip-x {{ opacity:0.6; }}
  .cuisine-chip.selected .chip-x:hover {{ opacity:1; background:#fecaca; color:#991b1b; }}

  /* ─── Card/Accordion Layout (Message Center Style) ─── */
  .section-card {{
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 14px;
    border: 2px solid #e8ecf0;
    background: #fff;
    transition: border-color .25s, box-shadow .25s, transform .15s;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }}
  .section-card:active {{ transform: scale(0.985); }}
  .section-card.expanded {{
    border-color: #6ee7b7;
    box-shadow: 0 6px 24px rgba(16,185,129,.12);
  }}
  .section-card-header {{
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 22px;
    cursor: pointer;
    user-select: none;
    min-height: 88px;
  }}
  .section-card-header:hover {{ background: #fafbfc; }}
  .section-card-icon {{
    font-size: 1.8em;
    flex-shrink: 0;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
  }}
  .section-card-title {{
    font-size: 1.2em;
    font-weight: 800;
    color: #1a202c;
    line-height: 1.3;
  }}
  .section-card-summary {{
    font-size: 0.88em;
    color: #64748b;
    margin-top: 4px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }}
  .section-card-arrow {{
    margin-left: auto;
    font-size: 1.1em;
    color: #94a3b8;
    transition: transform .3s ease;
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #f1f5f9;
  }}
  .section-card.expanded .section-card-arrow {{
    transform: rotate(180deg);
    background: #d1fae5;
    color: #065f46;
  }}
  .section-card-body {{
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s ease, padding .3s ease;
    padding: 0 22px;
  }}
  .section-card.expanded .section-card-body {{
    max-height: 8000px;
    padding: 0 22px 22px 22px;
    border-top: 1px solid #f1f5f9;
  }}

  /* ─── Sub-card (nested tap-to-expand items) ─── */
  .sub-card {{
    border-radius: 12px;
    margin-bottom: 8px;
    border: 1px solid #f1f5f9;
    background: #f8fafc;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
  }}
  .sub-card.open {{
    border-color: #d1d5db;
    box-shadow: 0 2px 8px rgba(0,0,0,.04);
  }}
  .sub-card-header {{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    min-height: 52px;
  }}
  .sub-card-header:active {{ background: #f1f5f9; }}
  .sub-card-icon {{ font-size: 1.3em; flex-shrink: 0; }}
  .sub-card-label {{ font-size: 0.82em; color: #64748b; line-height: 1.2; }}
  .sub-card-value {{ font-size: 1.05em; font-weight: 700; color: #1e293b; line-height: 1.3; }}
  .sub-card-arrow {{ margin-left: auto; font-size: 0.7em; color: #94a3b8; transition: transform .3s; }}
  .sub-card.open .sub-card-arrow {{ transform: rotate(90deg); color: #475569; }}
  .sub-card-body {{
    max-height: 0;
    overflow: hidden;
    transition: max-height .35s ease, padding .25s ease;
    padding: 0 16px;
    border-top: 0px solid transparent;
  }}
  .sub-card.open .sub-card-body {{
    max-height: 3000px;
    padding: 12px 16px 14px 16px;
    border-top: 1px solid #e8ecf0;
  }}

  /* ─── Mobile-First App Layout ─── */
  @media (max-width: 640px) {{
    body {{ font-size: 16px; line-height: 1.6; }}
    .max-w-md {{ max-width: 100% !important; padding: 0 !important; }}

    /* Section cards full width, less rounded */
    .section-card {{ border-radius: 14px; margin-bottom: 10px; }}
    .section-card-header {{ padding: 16px 14px; min-height: 72px; gap: 12px; }}
    .section-card-icon {{ width: 46px; height: 46px; font-size: 1.5em; border-radius: 12px; }}
    .section-card-title {{ font-size: 1.05em; }}
    .section-card-summary {{ font-size: 0.8em; }}
    .section-card-body {{ padding-left: 14px !important; padding-right: 14px !important; }}

    /* Sub-cards touch-friendly */
    .sub-card {{ border-radius: 10px; margin-bottom: 6px; }}
    .sub-card-header {{ padding: 14px 14px; min-height: 50px; }}
    .sub-card-value {{ font-size: 1em; }}
    .sub-card-label {{ font-size: 0.85em; }}
    .sub-card-body .text-sm {{ font-size: 0.95em; }}

    /* Feedback */
    .feedback-btn {{ opacity: 1 !important; font-size: 1.2em !important; padding: 6px 8px !important; min-width: 36px; min-height: 36px; }}
    .feedback-modal-box {{ padding: 24px; max-width: 94%; }}
    .feedback-reason {{ padding: 14px 16px; font-size: 1em; }}

    /* Meal tabs */
    #dayTabs button {{ padding: 8px 12px !important; font-size: 0.82em !important; }}

    /* Cuisine chips */
    .cuisine-chip {{ padding: 9px 14px; font-size: 0.88em; }}
    #customCuisineInput {{ font-size: 1em !important; padding: 10px 14px !important; }}

    /* Grids */
    .sm\\:grid-cols-2 {{ grid-template-columns: 1fr !important; }}
  }}

  /* ─── Larger screens (tablet+): slightly more breathing room ─── */
  @media (min-width: 641px) {{
    .max-w-md {{ max-width: 480px; }}
    body {{ font-size: 15px; }}
  }}
</style>
</head>
<body class="bg-slate-100 text-slate-800">
<div class="max-w-md mx-auto px-0 py-0 {layout_class}" style="min-height:100vh">

  <!-- App Header (compact, sticky) -->
  <div class="sticky top-0 z-50 bg-white border-b border-slate-200 px-4 py-3 shadow-sm">
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold text-slate-900">{header_greeting}</h1>
        <p class="text-xs text-slate-500">{current_time}</p>
      </div>
      <span class="inline-flex items-center gap-1 {status_badge_class} px-3 py-1.5 rounded-full text-xs font-semibold">{status_icon} {status_text}</span>
    </div>
    <div class="flex gap-1.5 mt-2 flex-wrap">{condition_badges}</div>
  </div>

  <!-- Escalation Banners -->
  <div class="px-3 pt-3">{escalation_html}</div>

  <!-- AI Message (modular sub-cards) -->
  <div class="px-3 pt-3 pb-1">
    <div class="bg-white rounded-2xl border border-slate-200 p-3 shadow-sm">
      <div class="flex items-center gap-2 mb-2 px-1">
        <span class="text-base">🤖</span>
        <span class="text-xs font-bold text-slate-600 uppercase tracking-wide">AI Health Companion</span>
      </div>
      {ai_message_html}
    </div>
  </div>

  <!-- Cards -->
  <div class="px-3 pt-2 pb-3">
    {cards_html}
  </div>

  <!-- Guardrail (slim footer) -->
  <div class="px-4 py-3 bg-slate-50 border-t border-slate-200">
    <p class="text-[11px] text-slate-400 text-center leading-relaxed">{guardrail}</p>
  </div>

</div>

<script>
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MEAL_LABELS = {{"breakfast":"Breakfast","lunch":"Lunch","dinner":"Dinner"}};
const rawMeals = {meal_data_json};
const meals = DAYS.map((d, i) => ({{ ...rawMeals[i % rawMeals.length], day: d }}));
let activeDay = 0;

const MEAL_FEEDBACK_REASONS = [
  "Don't like the taste",
  "Allergic / intolerant",
  "Can't find this ingredient",
  "Too difficult to prepare",
  "Other"
];
const GENERAL_FEEDBACK_REASONS = [
  "Not applicable to me",
  "Too difficult to do",
  "Already doing this",
  "Don't agree with this",
  "Other"
];
let feedbackStore = JSON.parse(localStorage.getItem("mealFeedback") || "{{}}");

function saveFeedback(dayIdx, mealType, itemName, reason) {{
  const key = `${{dayIdx}}-${{mealType}}-${{itemName}}`;
  feedbackStore[key] = {{ sentiment: "dislike", reason, timestamp: new Date().toISOString() }};
  localStorage.setItem("mealFeedback", JSON.stringify(feedbackStore));
  updateExportBadge();
}}

function saveLike(dayIdx, mealType, itemName) {{
  const key = `${{dayIdx}}-${{mealType}}-${{itemName}}`;
  feedbackStore[key] = {{ sentiment: "like", reason: null, timestamp: new Date().toISOString() }};
  localStorage.setItem("mealFeedback", JSON.stringify(feedbackStore));
  renderMeals();
  updateExportBadge();
}}

function getFeedback(dayIdx, mealType, itemName) {{
  return feedbackStore[`${{dayIdx}}-${{mealType}}-${{itemName}}`];
}}

const MEMORY_API_URL = "{memory_api_url}";
const MEMORY_API_TOKEN = "{memory_api_token}";

function buildPreferencePayload() {{
  const likes = [];
  const dislikes = [];
  for (const [key, val] of Object.entries(feedbackStore)) {{
    const entry = {{ item_key: key, ...val }};
    if (val.sentiment === "like") likes.push(entry);
    else dislikes.push(entry);
  }}
  const selectedCuisines = Object.entries(cuisinePrefs).map(([name, meta]) => ({{
    cuisine: name, ...meta
  }}));
  return {{
    user_id: "{patient_id}",
    data_type: "scenario",
    language: "en",
    timestamp: new Date().toISOString(),
    data: {{
      bundle: {{
        type: "user_preference",
        report_time: "{current_time}",
        total_feedback: likes.length + dislikes.length,
        cuisine_preferences: selectedCuisines,
        liked: likes,
        disliked: dislikes
      }}
    }}
  }};
}}

async function exportFeedbackJSON() {{
  const payload = buildPreferencePayload();

  if (MEMORY_API_URL && !MEMORY_API_URL.includes("{{")) {{
    // POST to memory API
    const btn = document.getElementById("exportFeedbackBtn");
    const origText = btn.textContent;
    btn.textContent = "⏳ Saving...";
    btn.disabled = true;
    try {{
      const resp = await fetch(MEMORY_API_URL, {{
        method: "POST",
        headers: {{
          "Content-Type": "application/json",
          "X-API-Token": MEMORY_API_TOKEN
        }},
        body: JSON.stringify(payload)
      }});
      if (resp.ok) {{
        btn.textContent = "✅ Saved to memory!";
        setTimeout(() => {{ btn.textContent = origText; btn.disabled = false; }}, 2500);
      }} else {{
        const errText = await resp.text();
        btn.textContent = "❌ Failed (" + resp.status + ")";
        console.error("Memory API error:", errText);
        setTimeout(() => {{ btn.textContent = origText; btn.disabled = false; }}, 3000);
      }}
    }} catch (err) {{
      console.error("Memory API unreachable:", err);
      btn.textContent = "❌ Network error";
      setTimeout(() => {{ btn.textContent = origText; btn.disabled = false; }}, 3000);
      // Fallback: download file
      downloadPayload(payload);
    }}
  }} else {{
    // No API configured — fallback to file download
    downloadPayload(payload);
  }}
}}

function downloadPayload(payload) {{
  const blob = new Blob([JSON.stringify(payload, null, 2)], {{ type: "application/json" }});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "patient_preferences_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
  URL.revokeObjectURL(url);
}}

function updateExportBadge() {{
  const btn = document.getElementById("exportFeedbackBtn");
  const hint = document.getElementById("submitHint");
  if (!btn) return;
  const fbCount = Object.keys(feedbackStore).length;
  const cuisineCount = Object.keys(cuisinePrefs).length;
  const total = fbCount + cuisineCount;
  if (total > 0) {{
    btn.textContent = "✓ Submit my preferences (" + total + ")";
    btn.style.display = "inline-block";
    if (hint) hint.style.display = "block";
  }} else {{
    btn.style.display = "none";
    if (hint) hint.style.display = "none";
  }}
}}

function showFeedbackModal(dayIdx, mealType, itemName) {{
  const existing = document.querySelector('.feedback-modal');
  if (existing) existing.remove();
  const isMeal = dayIdx >= 0;
  const reasons = isMeal ? MEAL_FEEDBACK_REASONS : GENERAL_FEEDBACK_REASONS;
  const title = isMeal ? "Why don't you want this food?" : "Why doesn't this work for you?";
  const displayName = itemName.length > 60 ? itemName.substring(0, 57) + "..." : itemName;
  const modal = document.createElement('div');
  modal.className = 'feedback-modal';
  modal.innerHTML = `
    <div class="feedback-modal-box">
      <div class="text-sm font-bold text-slate-800 mb-1">${{title}}</div>
      <div class="text-xs text-slate-500 mb-3">${{displayName}}</div>
      ${{reasons.map(r => `<button class="feedback-reason" data-reason="${{r}}">${{r}}</button>`).join('')}}
      <button class="feedback-reason" style="color:#94a3b8;border-color:#e2e8f0;margin-top:8px" data-reason="__cancel__">Cancel</button>
    </div>`;
  modal.addEventListener('click', function(e) {{
    const reason = e.target.dataset.reason;
    if (!reason) return;
    if (reason === '__cancel__') {{ modal.remove(); return; }}
    saveFeedback(dayIdx, mealType, itemName, reason);
    modal.remove();
    if (isMeal) renderMeals();
    e.target.closest('.feedback-modal').remove();
  }});
  document.body.appendChild(modal);
}}

function renderTabs() {{
  const container = document.getElementById("dayTabs");
  container.innerHTML = DAYS.map((d, i) =>
    `<button onclick="switchDay(${{i}})" class="px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${{i === activeDay ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}}">${{d}}</button>`
  ).join("");
}}

function switchDay(i) {{
  activeDay = i;
  renderTabs();
  renderMeals();
}}

function renderMeals() {{
  const day = meals[activeDay];
  if (!day) {{ document.getElementById("mealContent").innerHTML = '<p class="text-sm text-slate-400">No data</p>'; return; }}
  let html = "";
  for (const [key, label] of Object.entries(MEAL_LABELS)) {{
    const items = day[key] || [];
    if (!items.length) continue;
    html += `<div class="mb-4"><div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">${{label}}</div><div class="grid grid-cols-1 sm:grid-cols-2 gap-2">`;
    for (const it of items) {{
      const fb = getFeedback(activeDay, key, it.name);
      const likeClass = fb && fb.sentiment === "like" ? "liked" : "";
      const dislikeClass = fb && fb.sentiment === "dislike" ? "disliked" : "";
      const safeName = it.name.replace(/'/g, "&#39;");
      const reason = it.condition && it.benefit
        ? "For your " + it.condition.toLowerCase() + ": " + it.benefit.toLowerCase()
        : (it.benefit || "");
      html += `<div class="meal-card flex items-start gap-3 bg-slate-50 rounded-lg p-3 border border-slate-100">
        <span class="text-2xl mt-0.5">${{it.icon || "🍽️"}}</span>
        <div class="flex-1 min-w-0">
          <div class="text-sm font-semibold text-slate-800">${{it.name}}</div>
          <div class="text-xs text-emerald-600 mt-0.5 leading-relaxed italic">${{reason}}</div>
        </div>
        <div class="flex flex-col gap-1">
          <button class="feedback-btn like ${{likeClass}}" title="I like this" onclick="saveLike(${{activeDay}},'${{key}}','${{safeName}}')">👍</button>
          <button class="feedback-btn ${{dislikeClass}}" title="I don't want this" onclick="showFeedbackModal(${{activeDay}},'${{key}}','${{safeName}}')">👎</button>
        </div>
      </div>`;
    }}
    html += "</div></div>";
  }}
  document.getElementById("mealContent").innerHTML = html;
}}

// ─── Cuisine Preferences ───
const DEFAULT_CUISINES = [
  {{ name: "American", icon: "🍔" }},
  {{ name: "Italian", icon: "🍝" }},
  {{ name: "Japanese", icon: "🍣" }},
  {{ name: "Korean", icon: "🥘" }},
  {{ name: "Mexican", icon: "🌮" }},
  {{ name: "Indian", icon: "🍛" }},
  {{ name: "Mediterranean", icon: "🫒" }},
  {{ name: "Sichuan (川菜)", icon: "🌶️" }},
  {{ name: "Cantonese (粤菜)", icon: "🥡" }},
  {{ name: "Thai", icon: "🍜" }},
  {{ name: "French", icon: "🥐" }},
  {{ name: "Vietnamese", icon: "🍲" }},
];

let cuisinePrefs = JSON.parse(localStorage.getItem("cuisinePrefs") || "{{}}");

function renderCuisineChips() {{
  const container = document.getElementById("cuisineChips");
  if (!container) return;
  const allCuisines = [...DEFAULT_CUISINES];
  const customNames = Object.keys(cuisinePrefs).filter(n => !DEFAULT_CUISINES.some(d => d.name === n));
  for (const cn of customNames) {{
    allCuisines.push({{ name: cn, icon: "🍽️" }});
  }}
  container.innerHTML = allCuisines.map(c => {{
    const sel = cuisinePrefs[c.name] ? "selected" : "";
    return `<span class="cuisine-chip ${{sel}}" onclick="toggleCuisine('${{c.name.replace(/'/g,"&#39;")}}')">${{c.icon}} ${{c.name}}<span class="chip-x" onclick="event.stopPropagation();removeCuisine('${{c.name.replace(/'/g,"&#39;")}}')">✕</span></span>`;
  }}).join("");
  updateExportBadge();
}}

function toggleCuisine(name) {{
  if (cuisinePrefs[name]) {{
    delete cuisinePrefs[name];
  }} else {{
    cuisinePrefs[name] = {{ selected_at: new Date().toISOString() }};
  }}
  localStorage.setItem("cuisinePrefs", JSON.stringify(cuisinePrefs));
  renderCuisineChips();
  showCuisineToast();
}}

function showCuisineToast() {{
  const selected = Object.keys(cuisinePrefs);
  if (!selected.length) return;
  let existing = document.getElementById("cuisineToast");
  if (!existing) {{
    existing = document.createElement("div");
    existing.id = "cuisineToast";
    existing.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#065f46;color:#fff;padding:10px 20px;border-radius:12px;font-size:0.8em;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,0.2);z-index:9999;transition:opacity 0.3s;max-width:90%;text-align:center";
    document.body.appendChild(existing);
  }}
  existing.textContent = "✓ Saved! Next report will include " + selected.join(", ") + " recipes.";
  existing.style.opacity = "1";
  clearTimeout(existing._timer);
  existing._timer = setTimeout(() => {{ existing.style.opacity = "0"; }}, 3000);
}}

function removeCuisine(name) {{
  delete cuisinePrefs[name];
  localStorage.setItem("cuisinePrefs", JSON.stringify(cuisinePrefs));
  renderCuisineChips();
}}

function addCustomCuisine() {{
  const input = document.getElementById("customCuisineInput");
  const name = (input.value || "").trim();
  if (!name) return;
  cuisinePrefs[name] = {{ selected_at: new Date().toISOString(), custom: true }};
  localStorage.setItem("cuisinePrefs", JSON.stringify(cuisinePrefs));
  input.value = "";
  renderCuisineChips();
}}

document.getElementById("customCuisineInput").addEventListener("keydown", function(e) {{
  if (e.key === "Enter") {{ e.preventDefault(); addCustomCuisine(); }}
}});

renderCuisineChips();
renderTabs();
renderMeals();
updateExportBadge();

// ─── Card Accordion Toggle ───
document.querySelectorAll(".section-card-header").forEach(function(header) {{
  header.addEventListener("click", function() {{
    const card = header.closest(".section-card");
    if (!card) return;
    const wasExpanded = card.classList.contains("expanded");
    card.classList.toggle("expanded");
    if (!wasExpanded) {{
      setTimeout(function() {{ card.scrollIntoView({{ behavior: "smooth", block: "start" }}); }}, 100);
    }}
  }});
}});

// ─── Sub-card Toggle (tap item to expand its details) ───
document.querySelectorAll(".sub-card-header").forEach(function(header) {{
  header.addEventListener("click", function(e) {{
    e.stopPropagation();
    header.closest(".sub-card").classList.toggle("open");
  }});
}});
</script>
</body>
</html>
