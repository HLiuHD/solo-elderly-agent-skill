[project]
name = "skill-dev-kit"
version = "0.1.0"
description = "Standalone skill verification harness — mirrors the real SkillRuntime + SkillManager pipeline"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
verify-skill = "verify:main"
